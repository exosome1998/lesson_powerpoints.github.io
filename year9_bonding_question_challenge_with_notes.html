<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Year 9 Science — Bonding Question Challenge</title>
<style>
:root{
  --green:#00a651;--red:#e60000;--orange:#ff8a00;--blue:#0077b6;--purple:#7b2cbf;
  --yellow:#fff200;--ink:#111;--soft:#f7fbff;--metal:#dcecff;--ionp:#ff9a7d;--ionn:#7fd0ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#dfe5eb;color:var(--ink);font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;overflow:hidden}
body{display:grid;place-items:center}
#deck{width:1365px;height:768px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.25);position:relative;overflow:hidden;transform-origin:center center}
#progress{position:absolute;left:0;bottom:0;height:7px;background:var(--green);width:0;z-index:45;transition:width .2s ease}
#counter{position:absolute;left:18px;bottom:12px;color:#555;font-size:16px;z-index:40}
#score{position:absolute;right:196px;bottom:12px;font-size:16px;font-weight:900;color:#333;z-index:40}
.btnbar{position:absolute;right:18px;bottom:15px;display:flex;gap:8px;z-index:40}
.btnbar button,.utility button{font-size:16px;border:0;border-radius:999px;padding:9px 14px;background:#111;color:#fff;cursor:pointer}
.btnbar button:disabled{opacity:.35;cursor:default}
.utility{position:absolute;left:18px;top:14px;display:flex;gap:8px;z-index:40}
.utility button{padding:8px 12px}
.utility button[data-cat="metallic"]{background:var(--blue)}
.utility button[data-cat="ionic"]{background:var(--orange)}
.utility button[data-cat="covalent"]{background:var(--green)}
.utility button[data-cat="mixed"]{background:var(--purple)}
.utility button.active{outline:4px solid var(--yellow);outline-offset:2px}
.slide{position:absolute;inset:0;padding:62px 52px 70px;background:#fff;overflow:hidden}
h1,h2,h3,p{margin:0}
h2{font-size:43px;line-height:1.02;font-weight:900}
.hl{background:var(--yellow);padding:.02em .14em}
.clickhint{position:absolute;right:52px;top:24px;font-size:16px;border:2px solid #ddd;border-radius:999px;padding:6px 12px;background:#fafafa;color:#555}
.qtag{display:inline-block;border:4px solid #111;border-radius:999px;padding:5px 12px;font-size:17px;font-weight:900;margin-bottom:10px;background:#fff}
.qtag.metallic{border-color:var(--blue);background:#eef8ff}
.qtag.ionic{border-color:var(--orange);background:#fff5e8}
.qtag.covalent{border-color:var(--green);background:#effff3}
.qtag.mixed{border-color:var(--purple);background:#f6efff}
.qLayout{display:grid;grid-template-columns:730px 1fr;gap:30px;align-items:center;margin-top:20px;height:525px}
.visual{border:5px solid #111;border-radius:28px;background:var(--soft);height:500px;padding:12px;display:grid;place-items:center}
.visual svg{width:100%;height:100%}
.visual .formulaHero{font-size:110px;font-weight:900;letter-spacing:2px;text-align:center}
.visual .formulaSub{font-size:25px;font-weight:900;text-align:center;color:#444;margin-top:12px}
.visual .pairGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:90%}
.pairChip{border:5px solid #111;border-radius:22px;padding:22px;text-align:center;font-size:50px;font-weight:900}
.answers{display:flex;flex-direction:column;gap:13px}
.option{border:5px solid #111;border-radius:20px;background:#fff;padding:11px 14px;min-height:86px;cursor:pointer;display:grid;grid-template-columns:58px 1fr 42px;align-items:center;gap:12px;text-align:left}
.option:hover{background:#fafafa}
.option:disabled{cursor:default}
.letter{width:52px;height:52px;border:4px solid #111;border-radius:15px;display:grid;place-items:center;font-size:27px;font-weight:900;background:var(--yellow)}
.optionText{font-size:24px;font-weight:900;line-height:1.02}
.mark{font-size:35px;font-weight:900;text-align:center}
.option.correct{background:#effff2;border-color:var(--green)}
.option.correct .letter{background:#c9f7d2;border-color:var(--green)}
.option.wrong{background:#fff0f0;border-color:var(--red)}
.option.wrong .letter{background:#ffd9d9;border-color:var(--red)}
.option.showCorrect{border-color:var(--green);background:#f5fff7}
.feedback{border:5px solid #111;border-radius:18px;padding:10px 13px;background:var(--yellow);font-size:21px;font-weight:900;line-height:1.05;min-height:76px;display:flex;align-items:center}
.feedback.good{background:#effff2;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.smallRule{font-size:17px;color:#444;font-weight:900;margin-top:4px}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.legend span{border:3px solid #111;border-radius:999px;padding:5px 9px;background:#fff;font-size:15px;font-weight:900}
.atomLabel{fill:#111;font-size:23px;font-weight:900;text-anchor:middle;dominant-baseline:middle}
.label{fill:#111;font-size:22px;font-weight:900;text-anchor:middle}
.smallLabel{fill:#333;font-size:17px;font-weight:900;text-anchor:middle}
.electron{fill:var(--purple);stroke:#111;stroke-width:2}
.ionPlus{fill:var(--ionp);stroke:#111;stroke-width:3}
.ionMinus{fill:var(--ionn);stroke:#111;stroke-width:3}
.bond{stroke:var(--green);stroke-width:7;stroke-linecap:round}
.endScreen{height:620px;display:grid;place-items:center;text-align:center}
.endBox{border:7px solid #111;border-radius:32px;background:#fff;padding:34px 48px;max-width:900px}
.endBox h1{font-size:62px;line-height:1}
.endScore{font-size:105px;font-weight:900;color:var(--green);margin:12px 0}
.endBox p{font-size:26px;font-weight:900}
.endBox button{margin-top:22px;border:0;border-radius:999px;background:#111;color:#fff;font-size:22px;font-weight:900;padding:13px 22px;cursor:pointer}
@media print{html,body{overflow:auto;background:#fff}#deck{width:100%!important;height:auto!important;transform:none!important;box-shadow:none}.btnbar,.utility,#progress,#counter,#score{display:none}}

/* --- Visual note-taking pages --- */
.notePage{height:610px;display:grid;grid-template-rows:auto 1fr auto;gap:12px}
.noteHead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.noteHead h2{font-size:42px}
.noteInstruction{border:4px solid #111;border-radius:999px;background:var(--yellow);padding:7px 12px;font-size:17px;font-weight:900;white-space:nowrap}
.noteTable{display:grid;gap:9px;align-content:start;margin-top:4px}
.noteRow{display:grid;grid-template-columns:118px 1.25fr 1.1fr 1.35fr;border:4px solid #111;border-radius:17px;overflow:hidden;background:#fff;min-height:91px}
.noteRow>div{padding:9px 11px;border-left:3px solid #111;display:flex;align-items:center}
.noteRow>div:first-child{border-left:0;justify-content:center;background:#f7fbff}
.noteRow .noteKey{font-size:21px;font-weight:900;line-height:1.02}
.noteRow .noteWhy{font-size:18px;font-weight:900;line-height:1.06;color:#333}
.noteRow .noteExample{font-size:18px;font-weight:900;line-height:1.06;background:#fffbea}
.noteRow .noteExample b{font-size:22px}
.noteViz svg{width:92px;height:66px;display:block}
.noteViz .formulaMini{font-size:30px;font-weight:900;text-align:center}
.noteFoot{display:flex;justify-content:space-between;align-items:center;gap:16px}
.noteRule{border:5px solid #111;border-radius:18px;background:var(--yellow);padding:9px 14px;font-size:23px;font-weight:900;line-height:1.02;flex:1;text-align:center}
.noteCue{font-size:17px;color:#555;font-weight:900}
.notePage.metallic .noteRow{border-color:#496a91}.notePage.metallic .noteRow>div{border-color:#496a91}
.notePage.ionic .noteRow{border-color:var(--orange)}.notePage.ionic .noteRow>div{border-color:var(--orange)}
.notePage.covalent .noteRow{border-color:var(--green)}.notePage.covalent .noteRow>div{border-color:var(--green)}
.notePage.mixed .noteRow{border-color:var(--purple)}.notePage.mixed .noteRow>div{border-color:var(--purple)}
.noteNameGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.noteNameCard{border:4px solid #111;border-radius:17px;background:#fff;padding:8px;text-align:center;min-height:118px;display:grid;place-items:center}
.noteNameCard .f{font-size:31px;font-weight:900}
.noteNameCard .n{font-size:17px;font-weight:900;background:#effff2;border:3px solid #111;border-radius:10px;padding:4px 7px;margin-top:5px}
.noteCompare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.noteCompareCard{border:5px solid #111;border-radius:22px;padding:10px;background:#fff;text-align:center}
.noteCompareCard svg{width:100%;height:125px}
.noteCompareCard h3{font-size:27px;margin-bottom:5px}
.noteCompareCard .line{border-top:2px solid #111;padding:5px 3px;font-size:17px;font-weight:900}
.noteCompareCard.m{border-color:#496a91}.noteCompareCard.i{border-color:var(--orange)}.noteCompareCard.c{border-color:var(--green)}

</style>
</head>
<body>
<div id="deck">
  <div id="progress"></div>
  <div id="counter"></div>
  <div id="score"></div>

  <div class="utility">
    <button data-cat="all">ALL</button>
    <button data-cat="metallic">METALLIC</button>
    <button data-cat="ionic">IONIC</button>
    <button data-cat="covalent">COVALENT</button>
    <button data-cat="mixed">MIXED</button>
  </div>

  <div class="btnbar">
    <button id="prev">Back</button>
    <button id="next">Next</button>
  </div>

  <section class="slide" id="slide"></section>
</div>

  catBtns.forEach(b=>b.classList.toggle('active',b.dataset.cat===currentFilter));
}

  currentFilter=cat;
  filtered=ALL_ITEMS.filter(item=>cat==='all'||item.cat===cat);

  updateUtility();
  render();

function optionHTML(q,qi,oi){
  const answered=answers[qi]!==null;
  let cls='option',mark='';
  if(answered){
    if(oi===q.a){cls+=answers[qi]===oi?' correct':' showCorrect';mark='✓'}
    else if(answers[qi]===oi){cls+=' wrong';mark='✕'}
  }
  return `<button class="${cls}" data-opt="${oi}" ${answered?'disabled':''}>
    <span class="letter">${String.fromCharCode(65+oi)}</span>
    <span class="optionText">${q.o[oi]}</span>
    <span class="mark">${mark}</span>
  </button>`;
}
function feedbackHTML(q,qi){
  if(answers[qi]===null) return `<div class="feedback">Choose A, B or C.<div class="smallRule">&nbsp; Keyboard: 1 / 2 / 3</div></div>`;
  const good=answers[qi]===q.a;
  return `<div class="feedback ${good?'good':'bad'}"><div><b>${good?'✓ Correct':'✕ Not quite'}</b><div class="smallRule">${q.r}</div></div></div>`;
}

      <div class="noteHead">
        <div><div class="qtag ${n.cat}">NOTE PAGE</div><h2><span class="hl">${n.title}</span></h2></div>
        <div class="noteInstruction">✍ write 1 short line per row</div>
      </div>
      ${body}
      <div class="noteFoot">
        <div class="noteRule">${n.rule}</div>
        <div class="noteCue">Picture → key word → example</div>
      </div>
    </div>`;
  counter.textContent=`${idx+1} / ${filtered.length} • NOTE PAGE`;
  progress.style.width=`${((idx+1)/filtered.length)*100}%`;
  scoreEl.textContent=`Score ${score()} • Attempted ${answeredCount()}/${Q.length}`;
  prevBtn.disabled=idx===0;
  nextBtn.disabled=false;
  nextBtn.textContent=idx===filtered.length-1?'Finish':'Next';
}

function renderQuestion(item){
  const qi=item.qi,q=Q[qi],answered=answers[qi]!==null;
  slide.innerHTML=`
    <span class="clickhint">${answered?'Answer checked':'Choose before moving on'}</span>
    <div class="qtag ${q.cat}">${q.cat.toUpperCase()}</div>
    <h2>Question ${qi+1}: <span class="hl">${q.q}</span></h2>
    <div class="qLayout">
      <div class="visual">${q.v}</div>
      <div class="answers">
        ${q.o.map((_,oi)=>optionHTML(q,qi,oi)).join('')}
        ${feedbackHTML(q,qi)}
      </div>
    </div>`;
  slide.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answers[qi]!==null)return;
      answers[qi]=Number(btn.dataset.opt);
      render();
    });
  });
  counter.textContent=`${idx+1} / ${filtered.length} • overall Q${qi+1}/${Q.length}`;
  progress.style.width=`${((idx+1)/filtered.length)*100}%`;
  scoreEl.textContent=`Score ${score()} • Attempted ${answeredCount()}/${Q.length}`;
  prevBtn.disabled=idx===0;
  nextBtn.disabled=false;
  nextBtn.textContent=idx===filtered.length-1?'Finish':'Next';
}

function renderEnd(){
  slide.innerHTML=`<div class="endScreen"><div class="endBox">
    <h1><span class="hl">Question challenge complete</span></h1>
    <div class="endScore">${score()} / ${Q.length}</div>
    <p>${answeredCount()} questions attempted</p>
    <div class="legend"><span>metallic = move e⁻</span><span>ionic = transfer e⁻</span><span>covalent = share e⁻</span></div>
    <button id="restart">Restart all questions</button>
  </div></div>`;
  document.getElementById('restart').onclick=()=>{answers=Array(Q.length).fill(null);setFilter('all')};
  counter.textContent='Complete';
  progress.style.width='100%';
  scoreEl.textContent=`Score ${score()} / ${Q.length}`;
  prevBtn.disabled=false;
  nextBtn.disabled=true;
}
function render(){
  if(idx>=filtered.length){renderEnd();return}
  const item=currentItem();
  if(item.type==='note') renderNote(item); else renderQuestion(item);
}

prevBtn.addEventListener('click',()=>{if(idx>0){idx--;render()}});
nextBtn.addEventListener('click',()=>{if(idx<filtered.length){idx++;render()}});
document.addEventListener('keydown',e=>{
  if(idx>=filtered.length)return;
  const item=currentItem();
  if(['1','2','3'].includes(e.key)&&item.type==='q'&&answers[item.qi]===null){
    answers[item.qi]=Number(e.key)-1;render();
  }
  if(e.key==='ArrowRight'){e.preventDefault();if(!nextBtn.disabled)nextBtn.click()}
  if(e.key==='ArrowLeft'){e.preventDefault();if(!prevBtn.disabled)prevBtn.click()}
  if(e.key.toLowerCase()==='r'){answers=Array(Q.length).fill(null);setFilter('all')}
});
updateUtility();
render();

(function fit(){
  const scale=Math.min(innerWidth/1365,innerHeight/768,1);
  document.getElementById('deck').style.transform=`scale(${scale})`;
})();
addEventListener('resize',()=>{
  const scale=Math.min(innerWidth/1365,innerHeight/768,1);
  document.getElementById('deck').style.transform=`scale(${scale})`;
});
</script>
